apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisfleet-api
  namespace: aegisfleet
  labels:
    app: aegisfleet-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegisfleet-api
  template:
    metadata:
      labels:
        app: aegisfleet-api
    spec:
      containers:
      - name: api
        image: aegisfleet/api:v1.0
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: aegisfleet-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2048Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aegisfleet-api-service
  namespace: aegisfleet
spec:
  type: ClusterIP
  selector:
    app: aegisfleet-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegisfleet-hpa
  namespace: aegisfleet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegisfleet-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
