databases:
  - name: aegisfleet-db
    databaseName: aegis_fleet
    user: postgres
    plan: free

services:
  # 1. FastAPI Core API Gateway & Telemetry Engine
  - type: web
    name: aegisfleet-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn services.core_api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: aegisfleet-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

  # 2. React Web UI Operations Dashboard
  - type: web
    name: aegisfleet-ui
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: aegisfleet-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
