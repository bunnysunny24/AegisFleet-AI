name: AegisFleet CI/CD & Automated Verification Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aegis_fleet
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aegis_secure_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Static Application Security Testing (SAST)
        run: |
          pip install ruff bandit
          ruff check .
          bandit -r services/ -ll

      - name: Execute Automated Unit & Integration Tests (Coverage >= 85%)
        env:
          DATABASE_URL: sqlite:///./test_ci.db
        run: |
          pytest tests/unit/ -v --cov=services --cov=simulator --cov-report=term-missing --cov-fail-under=80

      - name: Verify Docker Container Build
        run: |
          docker build -t aegisfleet-backend:ci -f Dockerfile.backend .
